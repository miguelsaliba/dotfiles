# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

set -s escape-time 0
set -g aggressive-resize on
set -g history-limit 50000
set -g status-position top
set -g status-justify absolute-centre

set -g @primary red
set -g status-style "bg=default"
set -g status-left-length 60
set -g status-left " #S "
set -g status-right ""
set -g status-left-style "#{?client_prefix,fg=terminal bg=terminal reverse,fg=black bg=#{@primary}}"
set -g message-style "fg=white bg=black"
set -g mode-style "fg=black bg=#{@primary} bold"
set -g window-status-current-style "fg=black bg=#{@primary}"
set -g window-status-current-format ' #I #W #F '
set -g window-status-style "fg=#{@primary}"
set -g window-status-format ' #I #[fg=terminal]#W #[fg=#{@primary},dim]#F '

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mode-keys vi
set -g status-keys emacs
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind C-p previous-window
bind C-n next-window
bind f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer.sh"

bind R source-file ~/.config/tmux/tmux.conf

# things to make neovim theme work correctly
set -g focus-events on
set-environment -g COLORTERM "truecolor"
